<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1040" width="1080" height="1040" font-family="Inter, Arial, sans-serif">
<rect width="1080" height="1040" fill="#FFFFFF"/>
<text x="40" y="58" font-family="Inter Tight, Inter, Arial, sans-serif" font-weight="600" font-size="34" fill="#030D19">Pan / CBCT room: what goes on the plan</text>
<text x="40" y="96" font-size="21" fill="#3A4656">8 x 8 ft room, drawn to scale, 1 square = 1 ft. Illustrative, not a Medico project.</text>
<text x="40" y="126" font-size="21" fill="#3A4656">Shielding is set by an expert in radiation protection, not by this drawing.</text>
<line x1="150" y1="180" x2="150" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="180" x2="750" y2="180" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="225" y1="180" x2="225" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="255" x2="750" y2="255" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="300" y1="180" x2="300" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="330" x2="750" y2="330" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="375" y1="180" x2="375" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="405" x2="750" y2="405" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="450" y1="180" x2="450" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="480" x2="750" y2="480" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="525" y1="180" x2="525" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="555" x2="750" y2="555" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="600" y1="180" x2="600" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="630" x2="750" y2="630" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="675" y1="180" x2="675" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="705" x2="750" y2="705" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="750" y1="180" x2="750" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<line x1="150" y1="780" x2="750" y2="780" stroke="#1A73BB" stroke-opacity="0.12"/>
<rect x="265.5" y="180" width="369.0" height="270.75" fill="#1A73BB" fill-opacity="0.15" stroke="#1A73BB" stroke-width="3" stroke-dasharray="10 6"/>
<text x="450" y="292.5" text-anchor="middle" font-family="Inter Tight, Inter, Arial, sans-serif" font-weight="600" font-size="22" fill="#030D19">Pan / CBCT unit</text>
<text x="450" y="320.5" text-anchor="middle" font-size="17" fill="#3A4656">about 110 x 150 cm footprint</text>
<circle cx="450" cy="375.0" r="16" fill="#030D19"/><text x="450" y="419.0" text-anchor="middle" font-size="17" fill="#3A4656">patient</text>
<path d="M225 780 H150 V180 H750 V405 M750 555 V780 H450" fill="none" stroke="#1A73BB" stroke-width="10"/>
<rect x="745" y="405" width="10" height="150" fill="#FFFFFF" stroke="#030D19" stroke-width="2"/><line x1="750" y1="405" x2="750" y2="555" stroke="#030D19" stroke-width="2"/>
<line x1="265.5" y1="180" x2="634.5" y2="180" stroke="#030D19" stroke-width="4" stroke-dasharray="3 5"/>
<text x="450" y="165" text-anchor="middle" font-size="16" fill="#030D19">wall backing for the unit</text>
<path d="M450 780 A225 225 0 0 0 225 555" fill="none" stroke="#030D19" stroke-width="2" stroke-dasharray="6 5"/><line x1="225" y1="780" x2="225" y2="555" stroke="#030D19" stroke-width="3"/>
<rect x="780.0" y="405" width="210.0" height="150" fill="none" stroke="#030D19" stroke-width="2"/>
<text x="885.0" y="472.5" text-anchor="middle" font-weight="600" font-size="18" fill="#030D19">operator</text><text x="885.0" y="496.5" text-anchor="middle" font-size="16" fill="#3A4656">+ exposure switch</text>
<text x="780.0" y="600.0" text-anchor="start" font-size="18" fill="#1A73BB">Shielded viewing window:</text>
<text x="780.0" y="624.0" text-anchor="start" font-size="18" fill="#1A73BB">operator sees the patient</text>
<text x="780.0" y="648.0" text-anchor="start" font-size="18" fill="#1A73BB">during a pan or CBCT scan</text>
<text x="780.0" y="210.0" text-anchor="start" font-size="18" fill="#1A73BB">Every wall, floor and ceiling:</text>
<text x="780.0" y="234.0" text-anchor="start" font-size="18" fill="#1A73BB">material and thickness</text>
<text x="780.0" y="258.0" text-anchor="start" font-size="18" fill="#1A73BB">go on the plan</text>
<text x="127.5" y="480" text-anchor="end" font-size="18" fill="#3A4656">Neighbour</text>
<text x="127.5" y="504" text-anchor="end" font-size="18" fill="#3A4656">use and</text>
<text x="127.5" y="528" text-anchor="end" font-size="18" fill="#3A4656">occupancy</text>
<text x="127.5" y="552" text-anchor="end" font-size="18" fill="#3A4656">on the plan</text>
<text x="450" y="820" text-anchor="middle" font-size="18" fill="#3A4656">Corridor: door on the plan, and no one enters during</text>
<text x="450" y="844" text-anchor="middle" font-size="18" fill="#3A4656">an exposure without the operator knowing</text>
<text x="540" y="880" text-anchor="middle" font-size="18" fill="#030D19">Rooms above and below go on the plan too. For CBCT, 2 m with no shielding is not enough.</text>
<path d="M45.0 247.5 l14 34 h-28 z" fill="#030D19"/><text x="45.0" y="239.5" text-anchor="middle" font-size="18" font-weight="600" fill="#030D19">N</text>
<path d="M40 1000h150M40 990v20M190 990v20" stroke="#030D19" stroke-width="3"/><text x="202" y="1007" font-size="19" fill="#030D19">2 ft</text>
<text x="1040" y="1007" text-anchor="end" font-size="17" fill="#3A4656">Sources: Safety Code 30 (2022), B.1.2; HPA-RPD-065 (2010); Air Techniques (2024)</text>
</svg>